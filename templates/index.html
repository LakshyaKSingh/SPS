<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Stone Paper Scissors</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>STONE <span class="vs">VS</span> PAPER <span class="vs">VS</span> SCISSORS</h1>
            <p class="subtitle">AI-Powered Hand Gesture Battle</p>
        </header>

        <div class="game-area">
            <div class="scoreboard">
                <div class="score-box">
                    <span class="label">YOU</span>
                    <span id="user-score" class="value">0</span>
                </div>
                <div class="score-box">
                    <span class="label">DRAWS</span>
                    <span id="draw-score" class="value">0</span>
                </div>
                <div class="score-box">
                    <span class="label">CPU</span>
                    <span id="cpu-score" class="value">0</span>
                </div>
            </div>

            <div class="visual-section">
                <div class="camera-container">
                    <img src="{{ url_for('video_feed') }}" id="video-feed" alt="Webcam Feed">
                    <div id="countdown" class="countdown"></div>
                    <div id="gesture-overlay" class="gesture-overlay">Detecting...</div>
                </div>

                <div class="computer-container">
                    <div class="computer-card">
                        <div id="cpu-move-icon" class="move-icon">?</div>
                        <p>Computer Move</p>
                    </div>
                </div>
            </div>

            <div class="result-section">
                <h2 id="game-result">Press Start to Play!</h2>
                <div class="controls">
                    <button id="start-btn" class="btn btn-primary">START GAME</button>
                    <button id="reset-btn" class="btn btn-secondary">RESET SCORES</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Sound Effects -->
    <audio id="sound-win" src="https://cdn.pixabay.com/audio/2021/08/04/audio_bb63130c0e.mp3"></audio>
    <audio id="sound-lose" src="https://cdn.pixabay.com/audio/2022/03/10/audio_snippet-132.mp3"></audio>
    <audio id="sound-draw" src="https://cdn.pixabay.com/audio/2021/08/04/audio_062744782f.mp3"></audio>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
